<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>{{ title }} · loghour</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/layout.css"><link rel="stylesheet" href="/static/components.css"></head>
        <body><div class="app"><aside class="rail"><a class="rail__brand" href="/intake">LOGHOUR</a><nav class="rail__nav"><a class="rail__item" href="/logs">日志采信</a>
<a class="rail__item" href="/time">时间解析</a>
<a class="rail__item" href="/events">事件去重</a>
<a class="rail__item" href="/buckets">小时分桶</a>
<a class="rail__item" href="/watermark">迟到修订</a>
<a class="rail__item" href="/runs">批次对账</a></nav><div class="rail__foot">规则 2026.11<br>L10 水位时间轴</div></aside>
        <div class="work"><header class="topbar"><span class="topbar__title">{{ title }}</span><span class="signal">UTC WATERMARK ┃ +15 MIN</span><button class="btn" id="refresh">刷新</button></header>
        <main class="content"><div class="kpis"><div class="kpi"><b>批次</b><span>RUN-261116</span></div><div class="kpi"><b>输入</b><span>{{ data.input_count|default(12) }}</span></div><div class="kpi"><b>有效</b><span>{{ data.valid_count|default(9) }}</span></div><div class="kpi"><b>隔离</b><span>{{ data.quarantine_count|default(3) }}</span></div><div class="kpi"><b>状态</b><span class="sev">复核</span></div></div>
        {% block content %}{% endblock %}</main><footer class="statusbar"><span>v2026.11</span><span>Asia/Shanghai</span><span>/api/health</span></footer></div></div><script src="/static/app.js"></script><script src="/static/table.js"></script></body></html>
